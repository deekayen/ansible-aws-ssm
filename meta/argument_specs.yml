---
argument_specs:
  main:
    short_description: Install AWS EC2 Systems Manager (SSM) agent.
    description:
      - Imports Amazon's package signing key, installs the amazon-ssm-agent
        package from the official S3 downloads bucket, and optionally
        registers the node as a managed instance using a Systems Manager
        hybrid activation.
    author:
      - David Norman
    options:
      url:
        type: str
        default: amd64
        choices:
          - amd64
          - "386"
          - arm
          - arm64
        description: >-
          Architecture component of the download URL for the
          amazon-ssm-agent package. Automatically switched to 386 on 32-bit
          userspace hosts, and to arm64 on aarch64 hosts when left at amd64.

      disable_gpg_check:
        type: bool
        default: false
        description: >-
          Disable GPG signature checking when installing the RPM on
          RedHat-family hosts.

      gpg_key_url:
        type: str
        default: ""
        description: >-
          URL of Amazon's package signing public key. Leave empty to use the
          key bundled with the role (expires 2027-11-25); set it to override
          the bundled key after AWS rotates it.

      gpg_key_fingerprint:
        type: str
        default: 1c5b395cbe5e74e2f1ca21592784dbf388d19d46
        description: >-
          Full fingerprint of Amazon's package signing key, used to verify
          the imported key.

      aws_ssm_activation_code:
        type: str
        required: false
        description: >-
          Systems Manager hybrid activation code. When set together with
          aws_ssm_activation_id, the node is registered as a managed
          instance.

      aws_ssm_activation_id:
        type: str
        required: false
        description: >-
          Systems Manager hybrid activation ID. When set together with
          aws_ssm_activation_code, the node is registered as a managed
          instance.

      aws_ssm_ec2_region:
        type: str
        required: false
        description: >-
          AWS region used when registering the managed instance. Required
          when aws_ssm_activation_code and aws_ssm_activation_id are set.
