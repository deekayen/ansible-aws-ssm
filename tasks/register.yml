---
- name: Check if node is registered.
  ansible.builtin.stat:
    path: /var/lib/amazon/ssm/registration
  tags:
    - register_ssm_agent
  register: stat_result

- name: Register managed instance.
  ansible.builtin.command: >-
    amazon-ssm-agent -register -clear
    -code '{{ aws_ssm_activation_code }}'
    -id '{{ aws_ssm_activation_id }}'
    -region '{{ aws_ssm_ec2_region }}' -y
  register: aws_ssm_register_result
  changed_when: aws_ssm_register_result.rc == 0
  tags:
    - register_ssm_agent
  notify: Restart amazon-ssm-agent.
  when: not stat_result.stat.exists
