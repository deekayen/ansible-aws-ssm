---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Change URL destination for 32bit arch.
  ansible.builtin.set_fact:
    url: '386'
  when: ansible_facts.userspace_bits == '32'

- name: Change URL destination for 64-bit ARM.
  ansible.builtin.set_fact:
    url: arm64
  when:
    - ansible_facts.architecture == 'aarch64'
    - url == 'amd64'

- name: Install pre-required packages.
  ansible.builtin.package:
    name: gnupg
    state: present
  tags:
    - install_gnupg

- name: Copy the bundled signing key for Redhat family.
  ansible.builtin.copy:
    src: amazon-ssm-agent.gpg
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-amazon-ssm-agent
    owner: root
    group: root
    mode: "0644"
  tags:
    - import_rpm_key
  when:
    - ansible_facts.os_family == 'RedHat'
    - gpg_key_url | length == 0

- name: Import GPG key for Redhat family.
  ansible.builtin.rpm_key:
    key: "{{ gpg_key_url if gpg_key_url | length > 0 else '/etc/pki/rpm-gpg/RPM-GPG-KEY-amazon-ssm-agent' }}"
    fingerprint: "{{ gpg_key_fingerprint }}"
    state: present
  tags:
    - import_rpm_key
  when: ansible_facts.os_family == 'RedHat'

- name: Install RPM file for Redhat family.
  ansible.builtin.dnf:
    name: "https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_{{ url }}/amazon-ssm-agent.rpm"
    disable_gpg_check: "{{ disable_gpg_check }}"
    state: present
  tags:
    - install_ssm_agent
  register: install_result
  retries: 3
  until: install_result is success
  when: ansible_facts.os_family == 'RedHat'

# apt-key is gone from Debian 13 and Ubuntu 26.04, so trust the key as an
# apt trusted.gpg.d fragment instead.
- name: Import the bundled GPG key for Debian family.
  ansible.builtin.copy:
    src: amazon-ssm-agent.gpg
    dest: /etc/apt/trusted.gpg.d/amazon-ssm-agent.asc
    owner: root
    group: root
    mode: "0644"
  tags:
    - import_apt_key
  when:
    - ansible_facts.os_family == 'Debian'
    - gpg_key_url | length == 0

- name: Import GPG key from gpg_key_url for Debian family.
  ansible.builtin.get_url:
    url: "{{ gpg_key_url }}"
    dest: /etc/apt/trusted.gpg.d/amazon-ssm-agent.asc
    owner: root
    group: root
    mode: "0644"
  tags:
    - import_apt_key
  when:
    - ansible_facts.os_family == 'Debian'
    - gpg_key_url | length > 0

- name: Install deb file for Debian family.
  ansible.builtin.apt:
    deb: "https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/debian_{{ url }}/amazon-ssm-agent.deb"
  notify: Restart amazon-ssm-agent.
  tags:
    - install_ssm_agent
  register: install_result
  retries: 3
  until: install_result is success
  when: ansible_facts.os_family == 'Debian'

- name: Register instance with Systems Manager.
  ansible.builtin.include_tasks: register.yml
  tags:
    - register_ssm_agent
  when:
    - aws_ssm_activation_code is defined
    - not aws_ssm_activation_code == ''
    - aws_ssm_activation_id is defined
    - not aws_ssm_activation_id == ''

- name: Enable the amazon-ssm-agent service.
  ansible.builtin.service:
    name: amazon-ssm-agent
    enabled: true
  tags:
    - enable_ssm_service
  when: ansible_facts.os_family == 'Debian'
